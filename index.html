<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTutor — Raqamli Ta'lim Platformasi</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --border-card: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-card);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo i {
            color: var(--primary);
            -webkit-text-fill-color: initial;
            font-size: 1.8rem;
        }

        .role-switch-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-card);
            display: flex;
            gap: 4px;
        }

        .role-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .role-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        /* Layout Container */
        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        /* Analytics Overview Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(79, 70, 229, 0.15);
            color: var(--primary);
        }

        .stat-info h4 {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .stat-info .value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Dashboard Main Content Area */
        .content-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* Post & Feed Items */
        .feed-search {
            position: relative;
            margin-bottom: 1rem;
        }

        .feed-search i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .feed-search input {
            padding-left: 36px;
        }

        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .post-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 1.25rem;
            position: relative;
        }

        .post-card:hover {
            border-color: rgba(79, 70, 229, 0.4);
            transform: translateX(4px);
        }

        .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-announcement { background: rgba(79, 70, 229, 0.2); color: #818cf8; }
        .badge-assignment { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

        .post-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .post-body {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>EduTutor</span>
        </div>
        <div class="role-switch-container">
            <button class="role-btn active" id="btn-student" onclick="switchRole('student')">
                <i class="fa-solid fa-user-graduate"></i> Talaba
            </button>
            <button class="role-btn" id="btn-tutor" onclick="switchRole('tutor')">
                <i class="fa-solid fa-chalkboard-user"></i> Tyutor: Avazbek Azimov
            </button>
        </div>
    </header>

    <div class="main-container">
        
        <!-- Metrics Bar -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-bullhorn"></i></div>
                <div class="stat-info">
                    <h4>E'lonlar & Topshiriqlar</h4>
                    <div class="value" id="stat-posts-count">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.15); color: var(--accent-green);">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div class="stat-info">
                    <h4>Barcha Talabalar</h4>
                    <div class="value">28 ta</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(245, 158, 11, 0.15); color: var(--accent-amber);">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <div class="stat-info">
                    <h4>O'zlashtirish</h4>
                    <div class="value">94.2%</div>
                </div>
            </div>
        </div>

        <!-- Dashboard Layout -->
        <div class="content-grid">
            
            <!-- Side Panel -->
            <div class="glass-panel" id="side-panel">
                <div class="panel-header">
                    <span class="panel-title" id="panel-action-title">
                        <i class="fa-solid fa-plus-circle"></i> Yangi e'lon
                    </span>
                </div>
                
                <!-- Tutor Form -->
                <form id="post-form" onsubmit="handlePostSubmit(event)">
                    <div class="form-group">
                        <label>Post turi</label>
                        <select id="post-type">
                            <option value="E'lon">E'lon / Xabarnoma</option>
                            <option value="Topshiriq">Amaliy Topshiriq</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sarlavha</label>
                        <input type="text" id="post-title" placeholder="Masalan: 1-Amaliy topshiriq" required>
                    </div>
                    <div class="form-group">
                        <label>Mavzu batafsil</label>
                        <textarea id="post-content" rows="4" placeholder="Batafsil ko'rsatmalar va topshirish muddati..." required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-paper-plane"></i> Chop etish
                    </button>
                </form>

                <!-- Student Info Notice -->
                <div id="student-notice" style="display: none; color: var(--text-muted); font-size: 0.9rem; line-height: 1.6;">
                    <p><i class="fa-solid fa-circle-info" style="color: var(--primary);"></i> Siz talaba rejimidasiz. Tyutor Avazbek Azimov tomonidan yuklangan barcha yangilik va topshiriqlarni kuzatib boring.</p>
                </div>
            </div>

            <!-- Feed Panel -->
            <div class="glass-panel">
                <div class="panel-header">
                    <span class="panel-title"><i class="fa-solid fa-stream"></i> EduTutor Muloqot va Xabarlar</span>
                </div>

                <div class="feed-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="E'lonlar bo'yicha qidirish..." oninput="renderPosts()">
                </div>

                <div class="feed-list" id="feed-container">
                    <!-- Posts will render dynamically -->
                </div>
            </div>

        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        let currentRole = 'student';
        
        // Initial Demo Data
        const initialPosts = [
            {
                id: 1,
                type: "E'lon",
                title: "O'quv xonasi haqida muhim eslatma",
                content: "Hurmatli talabalar, ertangi amaliy mashg'ulot 2-bino 304-auditoriyada bo'lib o'tadi.",
                author: "Avazbek Azimov 👨‍🏫",
                date: "2026-10-28 08:30"
            },
            {
                id: 2,
                type: "Topshiriq",
                title: "Dasturiy prototip topshirig'i",
                content: "EduTutor veb-platformasi bo'yicha berilgan topshiriqlarni yakunlab, hisobotni tayyorlang. Muddat: Shanbagacha.",
                author: "Avazbek Azimov 👨‍🏫",
                date: "2026-10-28 08:00"
            }
        ];

        function getPosts() {
            const data = localStorage.getItem('edututor_posts');
            return data ? JSON.parse(data) : initialPosts;
        }

        function savePosts(posts) {
            localStorage.setItem('edututor_posts', JSON.stringify(posts));
        }

        function switchRole(role) {
            currentRole = role;
            document.getElementById('btn-student').classList.toggle('active', role === 'student');
            document.getElementById('btn-tutor').classList.toggle('active', role === 'tutor');
            
            const postForm = document.getElementById('post-form');
            const studentNotice = document.getElementById('student-notice');
            const panelTitle = document.getElementById('panel-action-title');

            if(role === 'tutor') {
                postForm.style.display = 'block';
                studentNotice.style.display = 'none';
                panelTitle.innerHTML = `<i class="fa-solid fa-plus-circle"></i> Yangi e'lon yaratish`;
            } else {
                postForm.style.display = 'none';
                studentNotice.style.display = 'block';
                panelTitle.innerHTML = `<i class="fa-solid fa-user-check"></i> Talaba Paneli`;
            }
        }

        function handlePostSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('post-type').value;
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;

            const newPost = {
                id: Date.now(),
                type: type,
                title: title,
                content: content,
                author: "Avazbek Azimov 👨‍🏫",
                date: new Date().toISOString().replace('T', ' ').substring(0, 16)
            };

            const posts = getPosts();
            posts.unshift(newPost);
            savePosts(posts);

            document.getElementById('post-title').value = '';
            document.getElementById('post-content').value = '';

            renderPosts();
        }

        function renderPosts() {
            const container = document.getElementById('feed-container');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const posts = getPosts();

            const filteredPosts = posts.filter(p => 
                p.title.toLowerCase().includes(searchQuery) || 
                p.content.toLowerCase().includes(searchQuery)
            );

            document.getElementById('stat-posts-count').innerText = posts.length + " ta";

            if(filteredPosts.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 2rem;">Ma'lumot topilmadi.</p>`;
                return;
            }

            container.innerHTML = filteredPosts.map(post => `
                <div class="post-card">
                    <div class="post-meta">
                        <span class="badge ${post.type === 'Topshiriq' ? 'badge-assignment' : 'badge-announcement'}">
                            ${post.type}
                        </span>
                        <span><i class="fa-regular fa-clock"></i> ${post.date}</span>
                    </div>
                    <div class="post-title">${post.title}</div>
                    <div class="post-body">${post.content}</div>
                    <div class="post-footer">
                        <div class="author-info">
                            <i class="fa-solid fa-chalkboard-user" style="color: var(--primary)"></i> ${post.author}
                        </div>
                        <div><i class="fa-solid fa-shield-halved"></i> EduTutor Hub</div>
                    </div>
                </div>
            `).join('');
        }

        switchRole('student');
        renderPosts();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSphere Pro — Ochiq Ta'lim Tizimi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0b0f19;
            --card-bg: rgba(23, 32, 54, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.2s ease;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        header {
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role-switch-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            display: flex;
            gap: 4px;
        }

        .role-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .role-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .wrapper {
            max-width: 1280px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 960px) {
            .wrapper {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem;
        }

        .card-header {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-primary);
        }

        .filter-btn {
            width: 100%;
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(99, 102, 241, 0.15);
            color: #fff;
            border-color: rgba(99, 102, 241, 0.3);
        }

        .workspace {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }

        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
        }

        .stat-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-val {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input, textarea, select {
            width: 100%;
            background: rgba(11, 15, 25, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .btn-action {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            background: var(--primary-hover);
        }

        .btn-export {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-export:hover {
            background: var(--success);
            color: #fff;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .feed-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem;
        }

        .feed-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .subject-badge {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .feed-teacher {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .feed-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 8px 0;
        }

        .feed-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .feed-actions {
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--card-border);
            padding-top: 10px;
            flex-wrap: wrap;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-outline:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        /* Modal oynalar */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 1rem;
        }

        .modal-content {
            background: #172036;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            padding: 1.5rem;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .notice-alert {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fa-solid fa-shapes"></i>
            <span>EduSphere Pro</span>
        </div>
        <div class="role-switch-container">
            <button class="role-btn active" id="btn-student" onclick="setRole('student')">
                <i class="fa-solid fa-graduation-cap"></i> Talaba
            </button>
            <button class="role-btn" id="btn-teacher" onclick="setRole('teacher')">
                <i class="fa-solid fa-chalkboard-user"></i> O'qituvchi Kabineti
            </button>
        </div>
    </header>

    <div class="wrapper">
        
        <!-- Chap menyu -->
        <div class="sidebar">
            <div class="card">
                <div class="card-header">
                    <span><i class="fa-solid fa-layer-group"></i> Fanlar</span>
                </div>
                <button class="filter-btn active" onclick="filterSubject('all', this)">
                    <span>Barcha Fanlar</span> <span id="count-all">0</span>
                </button>
                <button class="filter-btn" onclick="filterSubject('Dasturlash', this)">
                    <span>Dasturlash (IT)</span> <span id="count-it">0</span>
                </button>
                <button class="filter-btn" onclick="filterSubject('Oliy Matematika', this)">
                    <span>Oliy Matematika</span> <span id="count-math">0</span>
                </button>
                <button class="filter-btn" onclick="filterSubject('Fizika', this)">
                    <span>Fizika</span> <span id="count-physics">0</span>
                </button>
                <button class="filter-btn" onclick="filterSubject('Kiberxavfsizlik', this)">
                    <span>Kiberxavfsizlik</span> <span id="count-sec">0</span>
                </button>
            </div>

            <!-- O'qituvchi yangi dars qo'shishi -->
            <div class="card" id="teacher-tools" style="display: none;">
                <div class="card-header"><i class="fa-solid fa-folder-plus"></i> Yangi Dars / Vazifa</div>
                <form id="action-form" onsubmit="createEntry(event)">
                    <div class="form-group">
                        <label>O'qituvchi Ismi</label>
                        <input type="text" id="teacher-name" value="Avazbek Azimov 👨‍🏫" required>
                    </div>
                    <div class="form-group">
                        <label>Fanni tanlang</label>
                        <select id="entry-subject">
                            <option value="Dasturlash">Dasturlash (IT)</option>
                            <option value="Oliy Matematika">Oliy Matematika</option>
                            <option value="Fizika">Fizika</option>
                            <option value="Kiberxavfsizlik">Kiberxavfsizlik</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Turi</label>
                        <select id="entry-type">
                            <option value="Vazifa">Amaliy Vazifa</option>
                            <option value="Material">Darslik / Ma'ruza</option>
                            <option value="Test">Tezkor Test</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Mavzu nomi</label>
                        <input type="text" id="entry-title" placeholder="Mavzuni yozing..." required>
                    </div>
                    <div class="form-group">
                        <label>Batafsil matn yoki Havola</label>
                        <textarea id="entry-content" rows="3" placeholder="Yo'riqnoma yoki Google Drive / GitHub havolasi..." required></textarea>
                    </div>
                    <button type="submit" class="btn-action">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Tizimga Joylash
                    </button>
                </form>
            </div>

            <!-- Reyting jadvali -->
            <div class="card">
                <div class="card-header">
                    <span><i class="fa-solid fa-trophy" style="color: var(--warning);"></i> Top Talabalar</span>
                </div>
                <div style="font-size: 0.85rem; display: flex; flex-direction: column; gap: 10px;" id="leaderboard-list">
                    <!-- Dinamik ravishda chiqadi -->
                </div>
            </div>
        </div>

        <!-- O'ng asosiy panel -->
        <div class="workspace">
            
            <div id="status-alert" class="notice-alert"></div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-icon"><i class="fa-solid fa-chalkboard-user"></i></div>
                    <div>
                        <div class="stat-title">O'qituvchilar</div>
                        <div class="stat-val">12 ta</div>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon" style="color: var(--accent); background: rgba(6, 182, 212, 0.2);">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <div>
                        <div class="stat-title">Faol Talabalar</div>
                        <div class="stat-val">340+</div>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon" style="color: var(--success); background: rgba(16, 185, 129, 0.2);">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                    <div>
                        <div class="stat-title">Materiallar</div>
                        <div class="stat-val" id="total-entries">0 ta</div>
                    </div>
                </div>
            </div>

            <!-- Lenta -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 10px;">
                    <div class="card-header" style="margin-bottom: 0;">
                        <i class="fa-solid fa-graduation-cap"></i> Markaziy Ta'lim Oqimi
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="search-box" placeholder="Qidirish..." style="width: 180px;" oninput="renderWorkspace()">
                        <button class="btn-export" onclick="exportDataCSV()">
                            <i class="fa-solid fa-file-excel"></i> Eksport (CSV)
                        </button>
                    </div>
                </div>

                <div class="feed-container" id="workspace-feed"></div>
            </div>

        </div>

    </div>

    <!-- 1. MATERIALNI KO'RISH MODALI -->
    <div class="modal" id="view-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('view-modal')">&times;</button>
            <h3 id="modal-title" style="margin-bottom: 8px;"></h3>
            <p id="modal-author" style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px;"></p>
            <div id="modal-body" style="font-size: 0.9rem; line-height: 1.6; color: var(--text-primary); margin-bottom: 1.5rem; white-space: pre-wrap;"></div>
            <button class="btn-action" onclick="closeModal('view-modal')">Yopish</button>
        </div>
    </div>

    <!-- 2. JAVOB TOPSHIRISH MODALI -->
    <div class="modal" id="submit-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('submit-modal')">&times;</button>
            <h3 id="submit-task-title" style="margin-bottom: 6px;">Topshiriqni topshirish</h3>
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px;">Vazifa yechimi yoki fayl havolasini yuboring.</p>
            <form onsubmit="handleTaskSubmit(event)">
                <input type="hidden" id="submit-item-id">
                <div class="form-group">
                    <label>Talaba Ism-Familiyasi</label>
                    <input type="text" id="student-name" placeholder="Masalan: Jasur Ergashev" required>
                </div>
                <div class="form-group">
                    <label>Javob matni yoki GitHub/Drive havolasi</label>
                    <textarea id="student-submission" rows="3" placeholder="https://github.com/... yoki yechim matni" required></textarea>
                </div>
                <button type="submit" class="btn-action"><i class="fa-solid fa-paper-plane"></i> Javobni Yuborish</button>
            </form>
        </div>
    </div>

    <script>
        let currentSubject = 'all';
        let currentRole = 'student';

        // Standart boshlang'ich ma'lumotlar
        const defaultData = [
            {
                id: 1,
                subject: "Dasturlash",
                type: "Vazifa",
                teacher: "Avazbek Azimov 👨‍🏫",
                title: "Python ma'lumotlar bazasi (CRUD amallari)",
                desc: "SQLite yoki PostgreSQL bazasiga ulanish va foydalanuvchilarni qo'shish, yangilash hamda o'chirish kodini GitHub repozitoriyga yuklang.",
                date: "2026-10-30"
            },
            {
                id: 2,
                subject: "Oliy Matematika",
                type: "Material",
                teacher: "Dots. N. Qodirov",
                title: "Differensial tenglamalar: 4-Ma'ruza",
                desc: "Ushbu ma'ruzada yuqori tartibli chiziqli differensial tenglamalar va Koshi masalasini yechish usullari ko'rsatilgan.",
                date: "2026-10-29"
            },
            {
                id: 3,
                subject: "Kiberxavfsizlik",
                type: "Vazifa",
                teacher: "Prof. S. Aliyev",
                title: "Tarmoq paketlarini tahlil qilish (Wireshark)",
                desc: "Berilgan .pcap fayldagi shifrlanmagan parollarni topib, qisqa hisobot yozib yuklang.",
                date: "2026-10-28"
            }
        ];

        // Talabalar reytingi bazasi
        let leaderboard = [
            { name: "Akmal Rustamov", score: 98 },
            { name: "Madina Karimova", score: 95 },
            { name: "Jasur Ergashev", score: 92 }
        ];

        function getData() {
            const stored = localStorage.getItem('edusphere_entries');
            return stored ? JSON.parse(stored) : defaultData;
        }

        function saveData(data) {
            localStorage.setItem('edusphere_entries', JSON.stringify(data));
        }

        function showAlert(msg) {
            const el = document.getElementById('status-alert');
            el.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${msg}`;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3500);
        }

        function setRole(role) {
            currentRole = role;
            document.getElementById('btn-student').classList.toggle('active', role === 'student');
            document.getElementById('btn-teacher').classList.toggle('active', role === 'teacher');
            document.getElementById('teacher-tools').style.display = (role === 'teacher') ? 'block' : 'none';
        }

        function filterSubject(sub, btn) {
            currentSubject = sub;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            renderWorkspace();
        }

        function createEntry(e) {
            e.preventDefault();
            const teacher = document.getElementById('teacher-name').value;
            const subject = document.getElementById('entry-subject').value;
            const type = document.getElementById('entry-type').value;
            const title = document.getElementById('entry-title').value;
            const desc = document.getElementById('entry-content').value;

            const newItem = {
                id: Date.now(),
                subject: subject,
                type: type,
                teacher: teacher,
                title: title,
                desc: desc,
                date: new Date().toISOString().substring(0, 10)
            };

            const data = getData();
            data.unshift(newItem);
            saveData(data);

            document.getElementById('entry-title').value = '';
            document.getElementById('entry-content').value = '';
            showAlert("Yangi dars/topshiriq tizimga muvaffaqiyatli qo'shildi!");
            renderWorkspace();
        }

        // Modal funksiyalari
        function openViewModal(id) {
            const data = getData();
            const item = data.find(d => d.id == id);
            if(!item) return;

            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-author').innerText = `${item.subject} • ${item.teacher} • ${item.date}`;
            document.getElementById('modal-body').innerText = item.desc;
            document.getElementById('view-modal').style.display = 'flex';
        }

        function openSubmitModal(id, title) {
            document.getElementById('submit-item-id').value = id;
            document.getElementById('submit-task-title').innerText = `"${title}" bo'yicha topshirish`;
            document.getElementById('submit-modal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function handleTaskSubmit(e) {
            e.preventDefault();
            const studentName = document.getElementById('student-name').value;
            closeModal('submit-modal');
            
            // Talaba ballini oshirish va reytingga qo'shish
            let existing = leaderboard.find(l => l.name.toLowerCase() === studentName.toLowerCase());
            if(existing) {
                existing.score += 5;
            } else {
                leaderboard.push({ name: studentName, score: 85 });
            }
            leaderboard.sort((a,b) => b.score - a.score);
            renderLeaderboard();

            showAlert(`Rahmat, ${studentName}! Topshiriq qabul qilindi va reytingingizga ball qo'shildi.`);
            document.getElementById('student-submission').value = '';
        }

        // CSV eksport — Tyutor/O'qituvchi hisoboti
        function exportDataCSV() {
            const data = getData();
            let csvContent = "data:text/csv;charset=utf-8,Fan,Turi,Mavzu,O'qituvchi,Sana\n";
            data.forEach(d => {
                csvContent += `"${d.subject}","${d.type}","${d.title}","${d.teacher}","${d.date}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "EduSphere_Hisobot.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboard-list');
            const medals = ['🥇', '🥈', '🥉'];
            container.innerHTML = leaderboard.slice(0, 5).map((user, idx) => `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>${medals[idx] || (idx + 1) + '.'} ${user.name}</span>
                    <b style="color: var(--success);">${user.score} ball</b>
                </div>
            `).join('');
        }

        function renderWorkspace() {
            const container = document.getElementById('workspace-feed');
            const search = document.getElementById('search-box').value.toLowerCase();
            const data = getData();

            document.getElementById('total-entries').innerText = data.length + " ta";
            document.getElementById('count-all').innerText = data.length;
            document.getElementById('count-it').innerText = data.filter(d => d.subject === 'Dasturlash').length;
            document.getElementById('count-math').innerText = data.filter(d => d.subject === 'Oliy Matematika').length;
            document.getElementById('count-physics').innerText = data.filter(d => d.subject === 'Fizika').length;
            document.getElementById('count-sec').innerText = data.filter(d => d.subject === 'Kiberxavfsizlik').length;

            const filtered = data.filter(item => {
                const matchesSubject = (currentSubject === 'all') || (item.subject === currentSubject);
                const matchesSearch = item.title.toLowerCase().includes(search) || item.desc.toLowerCase().includes(search) || item.teacher.toLowerCase().includes(search);
                return matchesSubject && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 2.5rem; color: var(--text-secondary);">Ma'lumot topilmadi.</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="feed-card">
                    <div class="feed-top">
                        <span class="subject-badge">${item.subject} • ${item.type}</span>
                        <span class="feed-teacher"><i class="fa-solid fa-user-tie"></i> ${item.teacher}</span>
                    </div>
                    <div class="feed-title">${item.title}</div>
                    <div class="feed-desc">${item.desc}</div>
                    <div class="feed-actions">
                        <button class="btn-outline" onclick="openViewModal(${item.id})">
                            <i class="fa-solid fa-book-open"></i> Materialni Ko'rish
                        </button>
                        <button class="btn-outline" style="border-color: rgba(99,102,241,0.5); color: #818cf8;" onclick="openSubmitModal(${item.id}, '${item.title.replace(/'/g, "\\'")}')">
                            <i class="fa-solid fa-paper-plane"></i> Javob Topshirish
                        </button>
                        <span style="margin-left: auto; font-size: 0.8rem; color: var(--text-secondary); align-self: center;">
                            <i class="fa-regular fa-calendar"></i> ${item.date}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // Boshlang'ich ishga tushirish
        renderLeaderboard();
        renderWorkspace();
    </script>
</body>
</html>
